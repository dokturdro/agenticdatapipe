x-pipeline-environment: &pipeline-environment
  BIKE_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  BIKE_KAFKA_TOPIC: ${BIKE_KAFKA_TOPIC:-bike.station_status.v1}
  BIKE_KAFKA_GROUP_ID: ${BIKE_KAFKA_GROUP_ID:-bike-pipeline-v1}
  BIKE_DATA_DIR: /opt/airflow/data
  BIKE_STORAGE_BACKEND: delta
  BIKE_S3_ENDPOINT: http://minio:9000
  BIKE_S3_BUCKET: ${BIKE_S3_BUCKET:-bike-lake}
  BIKE_S3_REGION: ${BIKE_S3_REGION:-us-east-1}
  BIKE_S3_ACCESS_KEY_ID: ${BIKE_S3_ACCESS_KEY_ID:-minioadmin}
  BIKE_S3_SECRET_ACCESS_KEY: ${BIKE_S3_SECRET_ACCESS_KEY:-minioadmin}
  BIKE_S3_ALLOW_HTTP: "true"
  BIKE_OBSERVATIONS_TABLE: ${BIKE_OBSERVATIONS_TABLE:-delta/station_observations}
  BIKE_FEATURES_TABLE: ${BIKE_FEATURES_TABLE:-delta/station_features}
  BIKE_RAW_PREFIX: ${BIKE_RAW_PREFIX:-raw/gbfs}
  BIKE_AUDIT_PREFIX: ${BIKE_AUDIT_PREFIX:-audit/runs}
  BIKE_FEAST_REPO_PATH: /opt/airflow/project/feature_repo
  BIKE_FEAST_HISTORY_PATH: /opt/airflow/data/feast/station_features_history.parquet
  BIKE_FEAST_REGISTRY_PATH: /opt/airflow/data/feast/registry.db
  BIKE_FEAST_REDIS_CONNECTION: redis:6379
  BIKE_MLFLOW_TRACKING_URI: http://mlflow:5000
  BIKE_MLFLOW_EXPERIMENT: ${BIKE_MLFLOW_EXPERIMENT:-bike-availability-training}
  BIKE_MLFLOW_MODEL_NAME: ${BIKE_MLFLOW_MODEL_NAME:-bike-availability-15m}
  BIKE_MLFLOW_MODEL_ALIAS: ${BIKE_MLFLOW_MODEL_ALIAS:-champion}
  BIKE_FEAST_FEATURE_SERVICE: ${BIKE_FEAST_FEATURE_SERVICE:-bike_availability_service}
  BIKE_SYNTHETIC_HISTORY_DAYS: ${BIKE_SYNTHETIC_HISTORY_DAYS:-30}
  BIKE_SYNTHETIC_STATION_COUNT: ${BIKE_SYNTHETIC_STATION_COUNT:-8}
  BIKE_SYNTHETIC_SEED: ${BIKE_SYNTHETIC_SEED:-42}
  BIKE_OPENAI_MODEL: ${BIKE_OPENAI_MODEL:-gpt-4.1-mini}
  BIKE_FIXTURE_MODE: ${BIKE_FIXTURE_MODE:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-environment
    <<: *pipeline-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-development-jwt-secret-change-me}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS:-admin:admin}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/data/airflow/simple_auth_manager_passwords.json.generated
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/project/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./src:/opt/airflow/project/src:ro
    - ./feature_repo:/opt/airflow/project/feature_repo:ro
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BIKE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BIKE_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing "local/$${BIKE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${BIKE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BIKE_S3_SECRET_ACCESS_KEY:-minioadmin}
      BIKE_S3_BUCKET: ${BIKE_S3_BUCKET:-bike-lake}

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - s3://${BIKE_S3_BUCKET:-bike-lake}/mlflow-artifacts
      - --allowed-hosts
      - "*"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${BIKE_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${BIKE_S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${BIKE_S3_REGION:-us-east-1}
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlflow:/mlflow
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  bike-api:
    profiles: ["serving"]
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    environment:
      <<: *pipeline-environment
      BIKE_DATA_DIR: /app/data
      BIKE_FEAST_REPO_PATH: /app/feature_repo
      BIKE_FEAST_HISTORY_PATH: /app/data/feast/station_features_history.parquet
      BIKE_FEAST_REGISTRY_PATH: /app/data/feast/registry.db
    ports:
      - "${BIKE_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "mkdir -p /opt/airflow/data/airflow && airflow version"]
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  bike-producer:
    profiles: ["live"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: bikepipe produce
    environment:
      <<: *pipeline-environment
      BIKE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  postgres-data:
  redis-data:
